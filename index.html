<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тапай за Новых!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0d1b1e 0%, #00a896 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        /* Шапка с балансом */
        .header {
            text-align: center;
            margin-top: 20px;
            width: 100%;
        }
        .title {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0f7f4;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .score-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .score {
            font-size: 42px;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
        /* Главная кнопка-слон */
        .click-area {
            position: relative;
            width: 80vw;
            max-width: 320px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slon-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-image: url('slon.jpg'); /* Сюда сохраните вашу картинку */
            background-size: cover;
            background-position: center;
            border: 6px solid #00cbd6;
            box-shadow: 0 0 30px rgba(0, 203, 214, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .slon-btn:active {
            transform: scale(0.95);
        }
        /* Всплывающие цифры (+1) */
        .tap-pop {
            position: absolute;
            font-size: 32px;
            font-weight: 900;
            color: #00cbd6;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.2); }
        }
        /* Прогресс-бар энергии */
        .footer-stats {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00cbd6, #00ffcc);
            border-radius: 10px;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Собрано голосов</div>
        <div class="score-container">
            <span class="score" id="score">0</span>
        </div>
    </div>

    <div class="click-area" id="clickArea">
        <button class="slon-btn" id="slonBtn"></button>
    </div>

    <div class="footer-stats">
        <div class="energy-text">
            <span>⚡ Энергия</span>
            <span id="energyText">1000 / 1000</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="energyFill"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
