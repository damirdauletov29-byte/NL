<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тапай за Новых!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Supabase через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #ff6b00; /* Оранжевый цвет "Новых людей" */
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
            --secondary-text: #aaaaaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* Чтобы не скроллилось все тело */
            user-select: none;
            -webkit-user-select: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255,107,0,0.2) 0%, rgba(26,26,26,0) 100%);
        }

        .balance-label {
            font-size: 14px;
            color: var(--secondary-text);
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .coin-icon-small {
            width: 30px;
            height: 30px;
        }

        /* Main Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 80px; /* Отступ под меню */
        }

        .tab-content {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tap Tab */
        .tap-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .main-coin {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #ff8c00 0%, #ff6b00 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
            overflow: hidden;
            border: 8px solid #fff;
        }

        .main-coin:active {
            transform: scale(0.95);
        }

        .main-coin img {
            width: 60%;
            height: 60%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Leaderboard Styles */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .leaderboard-row {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .rank {
            width: 30px;
            font-weight: bold;
            font-size: 18px;
            color: var(--secondary-text);
        }

        .player-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #444;
        }

        .score {
            font-weight: bold;
            color: var(--primary-color);
        }

        .current-user-row {
            background-color: rgba(255, 107, 0, 0.15);
            border: 1px solid var(--primary-color);
        }
        
        .current-user-row .rank, 
        .current-user-row .score {
            color: #fff;
        }

        /* Bottom Navigation */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #252525;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--secondary-text);
            font-size: 10px;
            cursor: pointer;
            transition: color 0.2s;
            width: 20%;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        /* Floating Text Animation */
        .float-text {
            position: absolute;
            color: #fff;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }
        
        /* Loading Spinner */
        .loader {
            text-align: center;
            padding: 20px;
            color: var(--secondary-text);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="balance-label">Ваш баланс</div>
        <div class="balance-amount">
            <span id="balance">0</span>
            <img src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png" class="coin-icon-small" alt="coin">
        </div>
    </div>

    <!-- Content Tabs -->
    <div class="content">
        <!-- Tab 1: Tap -->
        <div id="tab-tap" class="tab-content active">
            <div class="tap-area">
                <div class="main-coin" id="tap-btn">
                    <!-- Логотип или иконка партии/слона -->
                    <img src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png" alt="Tap">
                </div>
                <p style="margin-top: 20px; color: #aaa;">Тапай и зарабатывай!</p>
            </div>
        </div>

        <!-- Tab 2: Boosts (Placeholder) -->
        <div id="tab-boosts" class="tab-content">
            <h2>Прокачка</h2>
            <p style="color: #aaa; text-align: center;">Раздел в разработке...</p>
        </div>

        <!-- Tab 3: Tasks (Placeholder) -->
        <div id="tab-tasks" class="tab-content">
            <h2>Задания</h2>
            <p style="color: #aaa; text-align: center;">Раздел в разработке...</p>
        </div>

        <!-- Tab 4: Exchange (Placeholder) -->
        <div id="tab-exchange" class="tab-content">
            <h2>Биржа</h2>
            <p style="color: #aaa; text-align: center;">Раздел в разработке...</p>
        </div>

        <!-- Tab 5: Rating -->
        <div id="tab-rating" class="tab-content">
            <h2 style="text-align: center; margin-bottom: 20px;">Рейтинг игроков</h2>
            <div id="leaderboard-container" class="leaderboard-list">
                <div class="loader">Загрузка рейтинга...</div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <div class="nav-item active" data-tab="tab-tap">
            <div class="nav-icon">👆</div>
            <span>Тап</span>
        </div>
        <div class="nav-item" data-tab="tab-boosts">
            <div class="nav-icon">🚀</div>
            <span>Прокачка</span>
        </div>
        <div class="nav-item" data-tab="tab-tasks">
            <div class="nav-icon">📋</div>
            <span>Задания</span>
        </div>
        <div class="nav-item" data-tab="tab-exchange">
            <div class="nav-icon">💱</div>
            <span>Биржа</span>
        </div>
        <div class="nav-item" data-tab="tab-rating">
            <div class="nav-icon">🏆</div>
            <span>Рейтинг</span>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. КОНФИГУРАЦИЯ SUPABASE (ВСТАВЬТЕ СВОИ ДАННЫЕ)
    // ==========================================
    const SUPABASE_URL = 'ВАШ_PROJECT_URL_ЗДЕСЬ'; 
    const SUPABASE_ANON_KEY = 'ВАШ_ANON_KEY_ЗДЕСЬ';

    // Инициализация клиента только если данные введены
    let supabaseClient = null;
    if (SUPABASE_URL !== 'https://ckppbsddgmqpmwppwujh.supabase.co' && SUPABASE_ANON_KEY !== 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcHBic2RkZ21xcG13cHB3dWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Mjc2MzYsImV4cCI6MjEwMTEwMzYzNn0.RCNjYdie4EmB58aVXGC2YlELUsl3wC3PtYgNMmmadvE') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } else {
        console.warn("⚠️ Supabase ключи не настроены! Рейтинг работать не будет.");
    }

    // ==========================================
    // 2. ОСНОВНАЯ ЛОГИКА ИГРЫ
    // ==========================================
    
    const tg = window.Telegram.WebApp;
    tg.expand(); // Раскрыть на весь экран

    // Получаем ТОЛЬКО ID пользователя для анонимности
    const user = tg.initDataUnsafe?.user;
    const playerId = user ? user.id : null;
    
    // Для тестов в браузере (если открыто не в Telegram)
    const testId = playerId ? null : Math.floor(Math.random() * 1000000000);
    const currentUserId = playerId || testId;
    
    if (!playerId) {
        console.log("⚠️ Запущено вне Telegram, используется тестовый ID:", currentUserId);
    }

    // Состояние игры
    let score = parseInt(localStorage.getItem('tap_score_' + currentUserId)) || 0;
    const balanceEl = document.getElementById('balance');
    const tapBtn = document.getElementById('tap-btn');

    // Обновление отображения баланса
    function updateBalanceDisplay() {
        balanceEl.textContent = score.toLocaleString();
    }
    updateBalanceDisplay();

    // Обработка клика (Тап)
    tapBtn.addEventListener('click', (e) => {
        // Анимация монеты
        const rect = tapBtn.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Создаем всплывающий текст
        const floatText = document.createElement('div');
        floatText.className = 'float-text';
        floatText.textContent = '+1';
        floatText.style.left = `${x}px`;
        floatText.style.top = `${y}px`;
        tapBtn.appendChild(floatText);

        setTimeout(() => floatText.remove(), 1000);

        // Увеличение счета
        score++;
        updateBalanceDisplay();
        localStorage.setItem('tap_score_' + currentUserId, score);
        
        // Вибрация (Haptic Feedback)
        if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
        }
    });

    // ==========================================
    // 3. РАБОТА С БАЗОЙ ДАННЫХ (SUPABASE)
    // ==========================================

    // Сохранение счета в базу
    async function savePlayerScore() {
        if (!supabaseClient || !currentUserId) return;

        try {
            const { error } = await supabaseClient
                .from('players')
                .upsert({ 
                    id: currentUserId, 
                    score: score, 
                    updated_at: new Date().toISOString() 
                }, { onConflict: 'id' });

            if (error) throw error;
            // console.log('Счет сохранен');
        } catch (error) {
            console.error('Ошибка при сохранении счета:', error);
        }
    }

    // Загрузка рейтинга
    async function fetchLeaderboard() {
        if (!supabaseClient) {
            document.getElementById('leaderboard-container').innerHTML = '<div class="loader">Сервер рейтинга не подключен</div>';
            return;
        }

        const container = document.getElementById('leaderboard-container');
        
        try {
            const { data, error } = await supabaseClient
                .from('players')
                .select('id, score')
                .order('score', { ascending: false })
                .limit(50);

            if (error) throw error;

            renderLeaderboard(data);
        } catch (error) {
            console.error('Ошибка при загрузке рейтинга:', error);
            container.innerHTML = '<div class="loader">Ошибка загрузки данных</div>';
        }
    }

    // Отрисовка рейтинга (АНОНИМНО)
    function renderLeaderboard(players) {
        const container = document.getElementById('leaderboard-container');
        container.innerHTML = '';

        if (!players || players.length === 0) {
            container.innerHTML = '<div class="loader">Пока нет игроков. Стань первым!</div>';
            return;
        }

        players.forEach((player, index) => {
            const row = document.createElement('div');
            row.className = 'leaderboard-row';
            
            // АНОНИМНОЕ ИМЯ: Игрок #ID
            const displayName = `Игрок #${player.id}`;
            
            // Иконки мест
            let rankIcon = `#${index + 1}`;
            if (index === 0) rankIcon = '🥇';
            if (index === 1) rankIcon = '🥈';
            if (index === 2) rankIcon = '🥉';

            // Проверка, это ли текущий игрок
            const isMe = player.id === currentUserId;
            if (isMe) row.classList.add('current-user-row');

            row.innerHTML = `
                <div class="rank">${rankIcon}</div>
                <div class="player-info">
                    <img src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png" class="avatar" alt="anon">
                    <span>${displayName} ${isMe ? '(Вы)' : ''}</span>
                </div>
                <div class="score">${player.score.toLocaleString()}</div>
            `;
            container.appendChild(row);
        });
    }

    // ==========================================
    // 4. НАВИГАЦИЯ И ТАЙМЕРЫ
    // ==========================================

    // Переключение вкладок
    const navItems = document.querySelectorAll('.nav-item');
    const tabContents = document.querySelectorAll('.tab-content');

    navItems.forEach(item => {
        item.addEventListener('click', () => {
            // Убираем активный класс у всех
            navItems.forEach(n => n.classList.remove('active'));
            tabContents.forEach(t => t.classList.remove('active'));

            // Добавляем активный класс нажатому
            item.classList.add('active');
            const tabId = item.getAttribute('data-tab');
            document.getElementById(tabId).classList.add('active');

            // Если открыли вкладку рейтинга - обновляем данные
            if (tabId === 'tab-rating') {
                fetchLeaderboard();
            }
        });
    });

    // Автосохранение каждые 5 секунд
    setInterval(savePlayerScore, 5000);
    
    // Сохранение при закрытии/сворачивании
    tg.onEvent('visibilityChanged', () => {
        if (!tg.isVisible) {
            savePlayerScore();
        }
    });

    // Первичная загрузка рейтинга (если вдруг сразу открыт)
    // Но лучше грузить только при переключении, чтобы не спамить запросами
    
    console.log("Игра запущена. ID игрока:", currentUserId);

</script>

</body>
</html>
