<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тапай за Новых!</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #0d1b1e 0%, #00a896 100%); color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.screen { display: none; flex-direction: column; align-items: center; justify-content: space-between; flex: 1; padding: 20px 20px 90px 20px; height: calc(100vh - 75px); overflow-y: auto; }
.screen.active { display: flex; }
.global-header { text-align: center; padding: 15px 0 5px; width: 100%; background: rgba(13, 27, 30, 0.4); backdrop-filter: blur(10px); }
.title { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: #e0f7f4; opacity: 0.8; margin-bottom: 3px; }
.score-container { display: flex; align-items: center; justify-content: center; gap: 10px; }
.score { font-size: 36px; font-weight: 800; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
.click-area { position: relative; width: 75vw; max-width: 300px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; margin: auto 0; }
.slon-btn { width: 100%; height: 100%; border-radius: 50%; background-image: url('slon.jpg'); background-size: cover; background-position: center; border: 6px solid #00cbd6; box-shadow: 0 0 30px rgba(0, 203, 214, 0.4); cursor: pointer; transition: transform 0.05s ease; outline: none; -webkit-tap-highlight-color: transparent; }
.slon-btn:active { transform: scale(0.95); }
.tap-pop { position: absolute; font-size: 32px; font-weight: 900; color: #00cbd6; text-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; animation: floatUp 0.6s ease-out forwards; }
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-120px) scale(1.2); } }
.footer-stats { width: 100%; max-width: 400px; }
.energy-text { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; font-weight: bold; }
.progress-bar { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #00cbd6, #00ffcc); border-radius: 10px; transition: width 0.1s ease; }

/* Навигация */
.navbar { position: fixed; bottom: 15px; left: 5%; width: 90%; max-width: 400px; height: 65px; background: rgba(20, 40, 43, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(0, 203, 214, 0.2); border-radius: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #a2b7b5; font-size: 11px; width: 20%; height: 100%; cursor: pointer; }
.nav-icon { font-size: 22px; margin-bottom: 2px; }
.nav-item.active { color: #00ffcc; }
.nav-item.active .nav-icon { transform: scale(1.15); }

/* Стили для Рейтинга */
.leaderboard-tabs { display: flex; width: 100%; max-width: 400px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 4px; }
.tab-btn { flex: 1; padding: 8px; text-align: center; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; color: #aaa; transition: all 0.2s; }
.tab-btn.active { background: #00cbd6; color: #0d1b1e; }
.leader-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; }
.leader-card { background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent; }
.leader-card.my-rank { background: rgba(0, 203, 214, 0.15); border-color: #00cbd6; }
.leader-rank { font-weight: 800; font-size: 18px; width: 30px; color: #00cbd6; }
.leader-info { flex: 1; padding-left: 10px; }
.leader-name { font-weight: bold; font-size: 14px; }
.leader-score { font-size: 12px; opacity: 0.7; }
</style>
</head>
<body>

<div class="global-header">
    <div class="title">Собрано голосов</div>
    <div class="score-container">
        <span class="score" id="score">0</span>
    </div>
</div>

<!-- ЭКРАН 1: ТАПАЛКА -->
<div class="screen active" id="screen-tap">
    <div class="click-area" id="clickArea">
        <button class="slon-btn" id="slonBtn"></button>
    </div>
    <div class="footer-stats">
        <div class="energy-text">
            <span>⚡ Энергия</span>
            <span id="energyText">1000 / 1000</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="energyFill"></div>
        </div>
    </div>
</div>

<!-- ЭКРАН 2: ЗАДАНИЯ -->
<div class="screen" id="screen-tasks">
    <h2 style="margin-bottom: 15px; color: #00cbd6;">💼 Поручения</h2>
    <div class="tasks-list" id="tasksList"></div>
</div>

<!-- ЭКРАН 3: РЕЙТИНГ (НОВЫЙ!) -->
<div class="screen" id="screen-leaderboard">
    <h2 style="margin-bottom: 15px; color: #00cbd6;">🏆 Рейтинг</h2>
    <div class="leaderboard-tabs">
        <div class="tab-btn active" onclick="switchTab('players')">Игроки</div>
        <div class="tab-btn" onclick="switchTab('regions')">Регионы</div>
    </div>
    <div class="leader-list" id="leaderList"></div>
</div>

<!-- ЭКРАН 4: ДРУЗЬЯ -->
<div class="screen" id="screen-friends">
    <h2 style="margin-bottom: 15px; color: #00cbd6;"> Сторонники</h2>
    <div class="referral-section">
        <p style="font-size: 14px; opacity: 0.9;">Приглашай друзей и получай бонусы!</p>
        <div class="referral-link-box" id="referralLink">Загрузка...</div>
        <button class="copy-btn" onclick="copyReferralLink()"> Копировать ссылку</button>
        <div class="referral-stats">
            <div class="stat-box">
                <div class="stat-number" id="referralCount">0</div>
                <div class="stat-label">Приглашено</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="referralBonus">0</div>
                <div class="stat-label">Бонус</div>
            </div>
        </div>
    </div>
</div>

<nav class="navbar">
    <div class="nav-item active" data-screen="screen-tap"><span class="nav-icon"></span><span>Тап</span></div>
    <div class="nav-item" data-screen="screen-tasks"><span class="nav-icon">💼</span><span>Задания</span></div>
    <div class="nav-item" data-screen="screen-leaderboard"><span class="nav-icon">🏆</span><span>Рейтинг</span></div>
    <div class="nav-item" data-screen="screen-friends"><span class="nav-icon">👥</span><span>Друзья</span></div>
</nav>

<script src="script.js"></script>
</body>
</html>
