<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тапай за Новых!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0d1b1e 0%, #00a896 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Общий контейнер для экранов */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex: 1;
            padding: 15px 15px 90px 15px; /* Отступ снизу под меню */
            height: calc(100vh - 75px);
            overflow-y: auto; /* Включаем прокрутку для длинных экранов */
        }
        .screen.active {
            display: flex;
        }

        /* Заглушки для пустых разделов */
        .placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80%;
            text-align: center;
            gap: 15px;
        }
        .placeholder-content h2 {
            font-size: 24px;
            color: #00cbd6;
        }

        /* Шапка с балансом (вынесена отдельно, видна везде) */
        .global-header {
            text-align: center;
            padding: 15px 0 5px;
            width: 100%;
            background: rgba(13, 27, 30, 0.4);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }
        .title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0f7f4;
            opacity: 0.8;
            margin-bottom: 3px;
        }
        .score-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .score {
            font-size: 36px;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* --- ЭКРАН 1: ТАПАЛКА --- */
        .click-area {
            position: relative;
            width: 75vw;
            max-width: 300px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto 0;
        }
        .slon-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-image: url('slon.jpg');
            background-size: cover;
            background-position: center;
            border: 6px solid #00cbd6;
            box-shadow: 0 0 30px rgba(0, 203, 214, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .slon-btn:active {
            transform: scale(0.95);
        }
        .tap-pop {
            position: absolute;
            font-size: 32px;
            font-weight: 900;
            color: #00cbd6;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.2); }
        }
        .footer-stats {
            width: 100%;
            max-width: 400px;
            margin-top: auto;
        }
        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00cbd6, #00ffcc);
            border-radius: 10px;
            transition: width 0.1s ease;
        }

        /* --- ЭКРАН 2: ПРОКАЧКА (УЛУЧШЕНИЯ) --- */
        .upgrade-header {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 203, 214, 0.2);
        }
        .pincome-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #a2b7b5;
        }
        .pincome-value {
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
        }
        .cards-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Стили карточки улучшения */
        .upgrade-card {
            background: rgba(20, 40, 43, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .upgrade-card:active {
            transform: scale(0.98);
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .card-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }
        .card-income {
            font-size: 12px;
            color: #00ffcc;
        }
        .card-level {
            font-size: 11px;
            color: #a2b7b5;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 8px;
            width: fit-content;
        }
        .buy-btn {
            background: #00cbd6;
            color: #0d1b1e;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 203, 214, 0.3);
            transition: background 0.2s;
        }
        .buy-btn:disabled {
            background: #4a5e60;
            color: #829294;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* --- НИЖНЕЕ МЕНЮ НАВИГАЦИИ --- */
        .navbar {
            position: fixed;
            bottom: 15px;
            left: 5%;
            width: 90%;
            max-width: 400px;
            height: 65px;
            background: rgba(20, 40, 43, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 203, 214, 0.2);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a2b7b5;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            width: 22%;
            height: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
            transition: transform 0.2s ease;
        }
        .nav-item.active {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- Общая шапка: баланс виден на любом экране -->
    <div class="global-header">
        <div class="title">Собрано голосов</div>
        <div class="score-container">
            <span class="score" id="score">0</span>
        </div>
    </div>

    <!-- ЭКРАН 1: ТАПАЛКА (ГЛАВНЫЙ) -->
    <div class="screen active" id="screen-tap">
        <div class="click-area" id="clickArea">
            <button class="slon-btn" id="slonBtn"></button>
        </div>

        <div class="footer-stats">
            <div class="energy-text">
                <span>⚡ Энергия</span>
                <span id="energyText">1000 / 1000</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="energyFill"></div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ПРОКАЧКА (ШТАБ ПАРТИИ) -->
    <div class="screen" id="screen-upgrade">
        <div class="upgrade-header">
            <div class="pincome-title">Пассивный рост сторонников</div>
            <div class="pincome-value">+<span id="passiveIncomeText">0</span> голосов/сек</div>
        </div>
        <div class="cards-container" id="cardsContainer">
            <!-- Сюда карточки будут добавляться динамически через JS -->
        </div>
    </div>

    <!-- ЭКРАН 3: КВЕСТЫ (ЗАДАНИЯ) -->
    <div class="screen" id="screen-tasks">
        <div class="placeholder-content">
            <h2>💼 Поручения</h2>
            <p>Выполняйте задания: подпишитесь на каналы партии, зовите сторонников и получайте бонусы.</p>
        </div>
    </div>

    <!-- ЭКРАН 4: ДРУЗЬЯ (РЕФЕРАЛЫ) -->
