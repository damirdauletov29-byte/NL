<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тапай за Новых!</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
        }

        .header {
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }

        .status {
            color: #00b4d8;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-container {
            font-size: 42px;
            font-weight: 800;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .income-view {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 10px;
        }

        .currency {
            color: #00b4d8;
        }

        /* Экраны */
        .screen {
            width: 100%;
            flex-grow: 1;
            display: none;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Главный экран кликера */
        #main-screen {
            flex-direction: column;
        }

        .coin-btn {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: radial-gradient(circle, #00b4d8 0%, #0077b6 100%);
            border: 8px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 180, 216, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coin-btn:active {
            transform: scale(0.95);
        }

        .coin-inner {
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }

        /* Экран прокачки */
        #upgrade-screen {
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            padding: 10px 0;
            gap: 12px;
        }

        .card {
            width: 90%;
            max-width: 350px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2d2d2d;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name {
            font-weight: bold;
            font-size: 16px;
        }

        .card-profit {
            font-size: 12px;
            color: #00b4d8;
        }

        .card-cost {
            font-size: 13px;
            color: #e0e0e0;
            background-color: #2a2a2a;
            padding: 6px 12px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .card-cost:hover {
            background-color: #00b4d8;
            color: #fff;
        }

        /* Подвал */
        .footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .energy-container {
            width: 90%;
            max-width: 350px;
        }

        .energy-text {
            font-size: 14px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #222;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background-color: #00b4d8;
            border-radius: 6px;
            transition: width 0.1s ease;
        }

        .menu {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .menu-item {
            background: none;
            border: none;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .menu-item.active {
            color: #00b4d8;
        }

        .floating-num {
            position: absolute;
            color: #00b4d8;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="status" id="player-status">Уровень 4: Политлидер района</div>
        <div class="balance-container">
            <span id="balance-view">0</span>
            <span class="currency">ПО</span>
        </div>
        <div class="income-view">В час: +<span id="income-view">0</span> ПО</div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН (КЛИКЕР) -->
    <div class="screen active" id="main-screen">
        <button class="coin-btn" id="coin-trigger">
            <div class="coin-inner">НОВЫЕ<br>ЛЮДИ</div>
        </button>
    </div>

    <!-- ЭКРАН ПРОКАЧКИ (МАГАЗИН) -->
    <div class="screen" id="upgrade-screen">
        <!-- Карточки будут создаваться автоматически через JavaScript -->
    </div>

    <div class="footer">
        <div class="energy-container">
            <div class="energy-text">
                <span>⚡ Энергия</span>
                <span id="energy-view">1000/1000</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="energy-fill"></div>
            </div>
        </div>

        <div class="menu">
            <button class="menu-item active" id="btn-main">🏠 Главная</button>
            <button class="menu-item" id="btn-upgrade">📈 Прокачка</button>
            <button class="menu-item" style="opacity: 0.4; cursor: not-allowed;">🎯 Задания</button>
            <button class="menu-item" style="opacity: 0.4; cursor: not-allowed;">🏆 Топ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
