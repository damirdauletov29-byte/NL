.navbar {
position: fixed;
bottom: 15px;
left: 5%;

max-width: 400px;
height: 65px;
background: rgba(20, 40, 43, 0.85);
backdrop-filter: blur(15px);
border: 1px solid rgba(0, 203, 214, 0.2);
border-radius: 20px;
display: flex;
justify-content: space-around;
align-items: center;
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
z-index: 1000;
}

flex-direction: column;

color: #a2b7b5;

cursor: pointer;
transition: all 0.2s ease;
-webkit-tap-highlight-color: transparent;
}

<body>
<!-- Общая шапка: баланс виден на любом экране -->
<div class="global-header">
<div class="title">Собрано голосов</div>
<div class="score-container">
<span class="score" id="score">0</span>
</div>
</div>
<!-- ЭКРАН 1: ТАПАЛКА (ГЛАВНЫЙ) -->
<div class="screen active" id="screen-tap">
<div class="click-area" id="clickArea">
<button class="slon-btn" id="slonBtn"></button>
</div>
<div class="footer-stats">
<div class="energy-text">
<span>⚡ Энергия</span>
<span id="energyText">1000 / 1000</span>
</div>
<div class="progress-bar">
<div class="progress-fill" id="energyFill"></div>
</div>
</div>
</div>
<!-- ЭКРАН 2: ПРОКАЧКА (УЛУЧШЕНИЯ) -->
<div class="screen" id="screen-upgrade">
<div class="upgrade-list" id="upgradeList">
<!-- Карты улучшений будут добавлены здесь скриптом -->
</div>
</div>
<!-- ЭКРАН 3: КВЕСТЫ (ЗАДАНИЯ) -->
<div class="screen" id="screen-tasks">
<div class="placeholder-content">
<h2>💼 Поручения</h2>
<p>Выполняйте задания: подпишитесь на каналы партии, зовите сторонников и получайте бонусы.</p>
</div>
</div>
<!-- ЭКРАН 4: ДРУЗЬЯ (РЕФЕРАЛЫ) -->
<div class="screen" id="screen-friends">
<div class="placeholder-content">
<h2>👥 Сторонники</h2>
<p>Приглашайте друзей по реферальной ссылке и получайте процент от их кликов!</p>
</div>
</div>
<!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ -->
<nav class="navbar">
<div class="nav-item active" data-screen="screen-tap">
<span class="nav-icon">🐘</span>
<span>Тап</span>
</div>
<div class="nav-item" data-screen="screen-upgrade">
<span class="nav-icon">📈</span>
<span>Прокачка</span>
</div>
<div class="nav-item" data-screen="screen-tasks">
<span class="nav-icon">💼</span>
<span>Задания</span>
</div>
<div class="nav-item" data-screen="screen-friends">
<span class="nav-icon">👥</span>
<span>Друзья</span>
</div>
</nav>
<script>
// --- ИГРОВАЯ ЛОГИКА (ТАПАЛКА, ЭНЕРГИЯ И СОХРАНЕНИЕ) ---
let score = 0;
let energy = 1000;
const maxEnergy = 1000;
const clickPower = 1;
const energyRegenSpeed = 3;
const scoreEl = document.getElementById('score');
const energyTextEl = document.getElementById('energyText');
const energyFillEl = document.getElementById('energyFill');
const clickArea = document.getElementById('clickArea');
const slonBtn = document.getElementById('slonBtn');

// --- ЛОГИКА ПРОКАЧКИ ---
let upgrades = [
    { id: 'click_power', name: 'Сила удара', description: 'Увеличивает количество голосов за один тап', baseCost: 100, costGrowth: 1.15, level: 0, profitPerClick: 1, type: 'click' },
    { id: 'auto_clicker', name: 'Авто-кликер', description: 'Автоматически собирает голоса', baseCost: 500, costGrowth: 1.3, level: 0, profitPerHour: 10, type: 'passive' },
    { id: 'energy_limit', name: 'Энергия', description: 'Увеличивает максимальный запас энергии', baseCost: 200, costGrowth: 1.2, level: 0, energyIncrease: 100, type: 'energy' },
    { id: 'regen_speed', name: 'Восстановление', description: 'Увеличивает скорость восстановления энергии', baseCost: 300, costGrowth: 1.25, level: 0, regenIncrease: 1, type: 'regen' }
];

function getUpgradeCost(upgrade) {
    return Math.floor(upgrade.baseCost * Math.pow(upgrade.costGrowth, upgrade.level));
}

function applyUpgrade(upgradeId) {
    const upgrade = upgrades.find(u => u.id === upgradeId);
    if (!upgrade) return false;

    const cost = getUpgradeCost(upgrade);
    if (score >= cost) {
        score -= cost;
        upgrade.level++;

        // Применение эффекта улучшения
        if (upgrade.type === 'click') {
            clickPower += upgrade.profitPerClick;
        } else if (upgrade.type === 'passive') {
            // Здесь можно добавить логику для пассивного дохода
            console.log(`Пассивный доход увеличен на ${upgrade.profitPerHour}`);
        } else if (upgrade.type === 'energy') {
            maxEnergy += upgrade.energyIncrease;
            energy = Math.min(energy, maxEnergy); // Не даем энергии превышать новый лимит
        } else if (upgrade.type === 'regen') {
            energyRegenSpeed += upgrade.regenIncrease;
        }

        saveGame();
        updateUI();
        renderUpgrades(); // Перерисовать экран прокачки
        return true;
    }
    return false;
}


// --- ФУНКЦИИ ИНТЕРФЕЙСА ---
function renderUpgrades() {
    const container = document.getElementById('upgradeList');
    container.innerHTML = ''; // Очистить перед рендером

    upgrades.forEach(upgrade => {
        const cost = getUpgradeCost(upgrade);
        const canAfford = score >= cost;

        const card = document.createElement('div');
        card.className = 'upgrade-card';

        card.innerHTML = `
            <div class="upgrade-header">
                <div class="upgrade-name">${upgrade.name}</div>
                <div class="upgrade-level">Уровень: ${upgrade.level}</div>
            </div>
            <div class="upgrade-profit">${upgrade.description}</div>
            <div class="upgrade-cost">Стоимость: ${cost.toLocaleString('ru-RU')}</div>
            <button class="upgrade-btn" data-id="${upgrade.id}" ${!canAfford ? 'disabled' : ''}>
                ${!canAfford ? 'Недостаточно голосов' : 'Улучшить'}
            </button>
        `;

        container.appendChild(card);
    });

    // Добавить обработчики кликов для кнопок улучшений
    document.querySelectorAll('#upgradeList .upgrade-btn').forEach(button => {
        button.addEventListener('click', () => {
            const upgradeId = button.getAttribute('data-id');
            applyUpgrade(upgradeId);
        });
    });
}


// Загрузка сохраненного прогресса из памяти браузера (LocalStorage)
function loadGame() {
    const savedScore = localStorage.getItem('nl_tap_score');
    const savedEnergy = localStorage.getItem('nl_tap_energy');
    const savedUpgrades = localStorage.getItem('nl_tap_upgrades');

    if (savedScore !== null) score = parseInt(savedScore, 10);
    if (savedEnergy !== null) energy = parseInt(savedEnergy, 10);
    if (savedUpgrades !== null) {
        try {
            const parsedUpgrades = JSON.parse(savedUpgrades);
            // Объединить сохраненные уровни с базовыми данными улучшений
            upgrades = upgrades.map(upg => {
                const saved = parsedUpgrades.find(s => s.id === upg.id);
                if (saved) {
                    upg.level = saved.level;
                    // Пересчитать статы на основе уровней
                    if (upg.type === 'click') {
                        for (let i = 0; i < upg.level; i++) {
                            clickPower += upg.profitPerClick;
                        }
                    } else if (upg.type === 'energy') {
                        for (let i = 0; i < upg.level; i++) {
                            maxEnergy += upg.energyIncrease;
                        }
                        energy = Math.min(energy, maxEnergy);
                    } else if (upg.type === 'regen') {
                        for (let i = 0; i < upg.level; i++) {
                            energyRegenSpeed += upg.regenIncrease;
                        }
                    }
                }
                return upg;
            });
        } catch (e) {
            console.error("Ошибка загрузки улучшений:", e);
        }
    }
}

// Запись текущего прогресса в LocalStorage
function saveGame() {
    localStorage.setItem('nl_tap_score', score);
    localStorage.setItem('nl_tap_energy', energy);
    // Сохраняем только уровень улучшений
    const upgradesToSave = upgrades.map(u => ({ id: u.id, level: u.level }));
    localStorage.setItem('nl_tap_upgrades', JSON.stringify(upgradesToSave));
}

// Обновление элементов интерфейса на основе актуальных данных
function updateUI() {
    scoreEl.textContent = score.toLocaleString('ru-RU');
    if (energyTextEl && energyFillEl) {
        energyTextEl.textContent = `${energy} / ${maxEnergy}`;
        const percentage = (energy / maxEnergy) * 100;
        energyFillEl.style.width = `${percentage}%`;
    }
}

// Функция обработки нажатия на кнопку-слона
function handleTap(e) {
    e.preventDefault(); // Защита от системного двойного тапа и масштабирования
    if (energy >= clickPower) {
        score += clickPower;
        energy -= clickPower;
        updateUI();
        saveGame(); // Сохраняем состояние сразу после изменения баланса
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[e.touches.length - 1].clientX;
            clientY = e.touches[e.touches.length - 1].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        createPopUp(clientX, clientY);
    }
}

// Создание анимированной вылетающей цифры (+1)
function createPopUp(x, y) {
    const pop = document.createElement('div');
    pop.classList.add('tap-pop');
    pop.textContent = `+${clickPower}`;
    const rect = clickArea.getBoundingClientRect();
    pop.style.left = `${x - rect.left - 15}px`;
    pop.style.top = `${y - rect.top - 30}px`;
    clickArea.appendChild(pop);
    setTimeout(() => { pop.remove(); }, 600);
}

// Привязка событий клика и тача к главной кнопке
if (slonBtn) {
    slonBtn.addEventListener('touchstart', handleTap, { passive: false });
    slonBtn.addEventListener('mousedown', handleTap);
}

// Таймер регенерации энергии (срабатывает раз в секунду)
setInterval(() => {
    if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + energyRegenSpeed);
        updateUI();
        saveGame(); // Периодически фиксируем восстановленную энергию
    }
}, 1000);

// --- ЛОГИКА НАВИГАЦИИ (ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ) ---
const navItems = document.querySelectorAll('.nav-item');
const screens = document.querySelectorAll('.screen');

navItems.forEach(item => {
    item.addEventListener('click', () => {
        // Снимаем активный статус со всех пунктов меню
        navItems.forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');

        const targetScreenId = item.getAttribute('data-screen');

        // Скрываем все разделы и отображаем выбранный пользователем
        screens.forEach(screen => {
            screen.classList.remove('active');
            if (screen.id === targetScreenId) {
                screen.classList.add('active');
                 // Если переключаемся на экран прокачки, перерисовать его
                 if (targetScreenId === 'screen-upgrade') {
                     renderUpgrades();
                 }
            }
        });
    });
});

// Запуск инициализации при открытии игры
loadGame();
updateUI();

</script>
</body>
</html>
