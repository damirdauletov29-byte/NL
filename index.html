<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тапай за Новых!</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
        }

        .header {
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }

        .status {
            color: #00b4d8;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-container {
            font-size: 42px;
            font-weight: 800;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .income-view {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 10px;
        }

        .currency {
            color: #00b4d8;
        }

        /* Экраны */
        .screen {
            width: 100%;
            flex-grow: 1;
            display: none;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Главный экран кликера */
        #main-screen {
            flex-direction: column;
        }

        /* Стильная бирюзовая кнопка-логотип */
        .coin-btn {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #00c2cb 0%, #008b94 100%);
            border: 8px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 194, 203, 0.5);
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.1s ease;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .coin-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 20px rgba(0, 194, 203, 0.3);
        }

        /* Графический логотип внутри кнопки (Буква Н в стиле Новых Людей) */
        .logo-svg {
            width: 130px;
            height: 130px;
            fill: #ffffff;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));
        }

        /* Экран прокачки и Заданий */
        #upgrade-screen, #tasks-screen {
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            padding: 10px 0;
            gap: 12px;
            width: 100%;
        }

        .card, .task-card {
            width: 90%;
            max-width: 350px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2d2d2d;
            box-sizing: border-box;
        }

        .card-info, .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .card-name, .task-name {
            font-weight: bold;
            font-size: 15px;
        }

        .card-profit, .task-reward {
            font-size: 12px;
            color: #00c2cb;
        }

        .card-cost, .task-btn, .invite-btn {
            font-size: 13px;
            color: #e0e0e0;
            background-color: #2a2a2a;
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .card-cost:hover, .task-btn:hover, .invite-btn:hover {
            background-color: #00c2cb;
            color: #fff;
        }

        .task-btn.done {
            background-color: #2a6f43;
            color: #fff;
            cursor: default;
        }

        /* Блок рефералов */
        .referral-section {
            width: 90%;
            max-width: 350px;
            background: linear-gradient(135deg, #1e1e1e 0%, #132427 100%);
            border-radius: 12px;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid #00c2cb;
            margin-bottom: 10px;
            text-align: center;
        }

        .ref-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            color: #00c2cb;
        }

        .ref-desc {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 12px;
        }

        /* Подвал */
        .footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .energy-container {
            width: 90%;
            max-width: 350px;
        }

        .energy-text {
            font-size: 14px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #222;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background-color: #00c2cb;
            border-radius: 6px;
            transition: width 0.1s ease;
        }

        .menu {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .menu-item {
            background: none;
            border: none;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .menu-item.active {
            color: #00c2cb;
        }

        .floating-num {
            position: absolute;
            color: #00c2cb;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="status" id="player-status">Уровень 1: Сторонник партии</div>
        <div class="balance-container">
            <span id="balance-view">0</span>
            <span class="currency">ПО</span>
        </div>
        <div class="income-view">В час: +<span id="income-view">0</span> ПО</div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН (КЛИКЕР С ЛОГОТИПОМ) -->
    <div class="screen active" id="main-screen">
        <button class="coin-btn" id="coin-trigger">
            <!-- Векторный минималистичный логотип Новых Людей (Стилизованная динамичная Н) -->
            <svg class="logo-svg" viewBox="0 0 100 100">
                <path d="M25 15 H40 V42 H60 V15 H75 V85 H60 V56 H40 V85 H25 Z" />
                <path d="M75 15 L85 25 L45 85 L35 75 Z" opacity="0.15" fill="#000"/>
            </svg>
        </button>
    </div>

    <!-- ЭКРАН ПРОКАЧКИ -->
    <div class="screen" id="upgrade-screen"></div>

    <!-- ЭКРАН ЗАДАНИЙ -->
    <div class="screen" id="tasks-screen">
        <div class="referral-section">
            <div class="ref-title">👥 Приведи друга</div>
            <div class="ref-desc">Получай +15 000 ПО за каждого приглашенного сторонника!</div>
            <button class="invite-btn" id="invite-trigger">🔗 Пригласить друга</button>
            <div style="font-size: 11px; color: #00c2cb; margin-top: 8px;" id="friends-count">Приглашено друзей: 0</div>
        </div>
        <div id="tasks-list" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;"></div>
    </div>

    <div class="footer">
        <div class="energy-container">
            <div class="energy-text">
                <span>⚡ Энергия</span>
                <span id="energy-view">1000/1000</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="energy-fill"></div>
            </div>
        </div>

        <div class="menu">
            <button class="menu-item active" id="btn-main">🏠 Главная</button>
            <button class="menu-item" id="btn-upgrade">📈 Прокачка</button>
            <button class="menu-item" id="btn-tasks">🎯 Задания</button>
            <button class="menu-item" style="opacity: 0.4; cursor: not-allowed;">🏆 Топ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
